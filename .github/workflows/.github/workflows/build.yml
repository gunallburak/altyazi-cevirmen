          cat > 'app/src/main/java/com/altyazi/cevirmen/TranslationService.kt' <<'__SON__'
          package com.altyazi.cevirmen

          import com.google.mlkit.common.model.DownloadConditions
          import com.google.mlkit.common.model.RemoteModelManager
          import com.google.mlkit.nl.translate.TranslateLanguage
          import com.google.mlkit.nl.translate.TranslateRemoteModel
          import com.google.mlkit.nl.translate.Translation
          import com.google.mlkit.nl.translate.Translator
          import com.google.mlkit.nl.translate.TranslatorOptions
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.tasks.await
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder

          data class Translated(val text: String, val source: String)

          /**
           * İngilizce → Türkçe çeviri.
           * - Google: çevrimiçi, hızlı ve isabetli (varsayılan).
           * - Cihaz içi: internetsiz çalışır (ML Kit), kalite biraz daha düşük.
           * - DeepL: en doğal çeviri, ücretsiz API anahtarı gerekir.
           * Çevrimiçi motor hata verirse, paket inmişse otomatik olarak cihaz içine geçer.
           */
          class TranslationService(private val prefs: Prefs) {

              private val cache = object : LinkedHashMap<String, String>(64, 0.75f, true) {
                  override fun removeEldestEntry(eldest: MutableMap.MutableEntry<String, String>?): Boolean = size > 400
              }

              private val offline: Translator = Translation.getClient(
                  TranslatorOptions.Builder()
                      .setSourceLanguage(TranslateLanguage.ENGLISH)
                      .setTargetLanguage(TranslateLanguage.TURKISH)
                      .build()
              )

              @Volatile
              private var offlineReady = false

              suspend fun translate(text: String): Translated {
                  val engine = prefs.engine
                  val key = "$engine|$text"
                  synchronized(cache) { cache[key] }?.let { return Translated(it, labelFor(engine)) }

                  val result = when (engine) {
                      Prefs.ENGINE_OFFLINE -> {
                          downloadModel(wifiOnly = false)
                          Translated(offlineTranslate(text), labelFor(engine))
                      }
                      Prefs.ENGINE_DEEPL -> try {
                          Translated(deepl(text), labelFor(engine))
                      } catch (e: Exception) {
                          fallback(text, e)
                      }
                      else -> try {
                          Translated(google(text), labelFor(engine))
                      } catch (e: Exception) {
                          fallback(text, e)
                      }
                  }
                  synchronized(cache) { cache[key] = result.text }
                  return result
              }

              private suspend fun fallback(text: String, error: Exception): Translated {
                  if (isModelDownloaded()) {
                      return Translated(offlineTranslate(text), "Cihaz içi (yedek)")
                  }
                  throw error
              }

              private suspend fun google(text: String): String = withContext(Dispatchers.IO) {
                  val url = URL(
                      "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=tr&dt=t&q=" +
                          URLEncoder.encode(text, "UTF-8")
                  )
                  val c = url.openConnection() as HttpURLConnection
                  c.connectTimeout = 4000
                  c.readTimeout = 6000
                  c.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android) AltyaziCevirmeni")
                  try {
                      val code = c.responseCode
                      if (code != 200) throw IOException("Google çeviri yanıt vermedi (kod $code)")
                      val body = c.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                      val parts = JSONArray(body).getJSONArray(0)
                      val sb = StringBuilder()
                      for (i in 0 until parts.length()) {
                          val seg = parts.optJSONArray(i) ?: continue
                          if (seg.isNull(0)) continue
                          sb.append(seg.getString(0))
                      }
                      val out = sb.toString().trim()
                      if (out.isEmpty()) throw IOException("Boş çeviri geldi")
                      out
                  } finally {
                      c.disconnect()
                  }
              }

              private suspend fun deepl(text: String): String = withContext(Dispatchers.IO) {
                  val authKey = prefs.deeplKey
                  if (authKey.isBlank()) throw IOException("DeepL anahtarı girilmemiş (Ayarlar)")
                  val host = if (authKey.endsWith(":fx")) "api-free.deepl.com" else "api.deepl.com"
                  val c = URL("https://$host/v2/translate").openConnection() as HttpURLConnection
                  c.connectTimeout = 4000
                  c.readTimeout = 6000
                  c.requestMethod = "POST"
                  c.doOutput = true
                  c.setRequestProperty("Authorization", "DeepL-Auth-Key $authKey")
                  c.setRequestProperty("Content-Type", "application/x-www-form-urlencoded; charset=utf-8")
                  try {
                      val form = "text=" + URLEncoder.encode(text, "UTF-8") + "&source_lang=EN&target_lang=TR"
                      c.outputStream.use { it.write(form.toByteArray(Charsets.UTF_8)) }
                      val code = c.responseCode
                      if (code == 403) throw IOException("DeepL anahtarı geçersiz")
                      if (code == 456) throw IOException("DeepL aylık ücretsiz kotası doldu")
                      if (code != 200) throw IOException("DeepL yanıt vermedi (kod $code)")
                      val body = c.inputStream.bufferedReader(Charsets.UTF_8).use { it.readText() }
                      JSONObject(body).getJSONArray("translations").getJSONObject(0).getString("text").trim()
                  } finally {
                      c.disconnect()
                  }
              }

              private suspend fun offlineTranslate(text: String): String = offline.translate(text).await()

              /** Cihaz içi çeviri paketini indirir (~30 MB). Zaten varsa hemen döner. */
              suspend fun downloadModel(wifiOnly: Boolean) {
                  if (offlineReady) return
                  val conditions = DownloadConditions.Builder().apply { if (wifiOnly) requireWifi() }.build()
                  offline.downloadModelIfNeeded(conditions).await()
                  offlineReady = true
              }

              suspend fun isModelDownloaded(): Boolean {
                  if (offlineReady) return true
                  return try {
                      val model = TranslateRemoteModel.Builder(TranslateLanguage.TURKISH).build()
                      val ok = RemoteModelManager.getInstance().isModelDownloaded(model).await()
                      if (ok) offlineReady = true
                      ok
                  } catch (e: Exception) {
                      false
                  }
              }

              fun close() {
                  offline.close()
              }

              companion object {
                  fun labelFor(engine: String) = when (engine) {
                      Prefs.ENGINE_OFFLINE -> "Cihaz içi"
                      Prefs.ENGINE_DEEPL -> "DeepL"
                      else -> "Google"
                  }
              }
          }

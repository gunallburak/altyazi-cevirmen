          mkdir -p 'app/src/main/java/com/altyazi/cevirmen'
          cat > 'app/src/main/java/com/altyazi/cevirmen/MainActivity.kt' <<'__SON__'
          package com.altyazi.cevirmen

          import android.Manifest
          import android.content.pm.PackageManager
          import android.graphics.Bitmap
          import android.graphics.Canvas
          import android.graphics.ColorMatrix
          import android.graphics.ColorMatrixColorFilter
          import android.graphics.Matrix
          import android.graphics.Paint
          import android.graphics.RectF
          import android.hardware.display.DisplayManager
          import android.os.Bundle
          import android.os.SystemClock
          import android.util.Size
          import android.view.MotionEvent
          import android.view.Surface
          import android.view.View
          import android.view.WindowManager
          import android.widget.ImageView
          import android.widget.SeekBar
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.camera.core.Camera
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.FocusMeteringAction
          import androidx.camera.core.ImageAnalysis
          import androidx.camera.core.ImageProxy
          import androidx.camera.core.Preview
          import androidx.camera.core.resolutionselector.AspectRatioStrategy
          import androidx.camera.core.resolutionselector.ResolutionSelector
          import androidx.camera.core.resolutionselector.ResolutionStrategy
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.core.content.ContextCompat
          import androidx.core.view.WindowCompat
          import androidx.core.view.WindowInsetsCompat
          import androidx.core.view.WindowInsetsControllerCompat
          import androidx.lifecycle.lifecycleScope
          import com.google.android.material.button.MaterialButton
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.Text
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import kotlinx.coroutines.launch
          import java.util.concurrent.ExecutorService
          import java.util.concurrent.Executors
          import java.util.concurrent.TimeUnit
          import kotlin.math.min

          class MainActivity : AppCompatActivity() {

              private lateinit var prefs: Prefs
              private lateinit var translator: TranslationService
              private lateinit var speaker: Speaker
              private lateinit var tracker: SubtitleTracker

              private lateinit var previewView: PreviewView
              private lateinit var overlay: RegionOverlayView
              private lateinit var statusText: TextView
              private lateinit var translatedText: TextView
              private lateinit var originalText: TextView
              private lateinit var cropPreview: ImageView
              private lateinit var zoomBar: SeekBar
              private lateinit var exposureBar: SeekBar
              private lateinit var btnRegion: MaterialButton
              private lateinit var btnPause: MaterialButton
              private lateinit var btnSettings: MaterialButton

              private lateinit var analysisExecutor: ExecutorService
              private val recognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)

              private var camera: Camera? = null
              private var previewUseCase: Preview? = null
              private var analysisUseCase: ImageAnalysis? = null

              @Volatile private var paused = false
              @Volatile private var busy = false
              @Volatile private var lastAnalysisAt = 0L
              @Volatile private var regionNorm = RectF(RegionOverlayView.DEFAULT_REGION)
              @Volatile private var overlayW = 0
              @Volatile private var overlayH = 0
              @Volatile private var enhance = true

              private var requestCounter = 0
              private var shownCounter = 0
              private var waitingSince = 0L

              private val permissionLauncher =
                  registerForActivityResult(ActivityResultContracts.RequestPermission()) { granted ->
                      if (granted) startCamera()
                      else setStatus("Kamera izni olmadan çalışamam. Uygulama ayarlarından kamera iznini aç.")
                  }

              private val displayListener = object : DisplayManager.DisplayListener {
                  override fun onDisplayAdded(displayId: Int) {}
                  override fun onDisplayRemoved(displayId: Int) {}
                  override fun onDisplayChanged(displayId: Int) {
                      val rotation = currentRotation()
                      previewUseCase?.targetRotation = rotation
                      analysisUseCase?.targetRotation = rotation
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  setContentView(R.layout.activity_main)
                  hideSystemBars()

                  prefs = Prefs(this)
                  translator = TranslationService(prefs)
                  tracker = SubtitleTracker(prefs.stability)
                  speaker = Speaker(this) { msg -> setStatus(msg) }

                  previewView = findViewById(R.id.previewView)
                  overlay = findViewById(R.id.overlay)
                  statusText = findViewById(R.id.statusText)
                  translatedText = findViewById(R.id.translatedText)
                  originalText = findViewById(R.id.originalText)
                  cropPreview = findViewById(R.id.cropPreview)
                  zoomBar = findViewById(R.id.zoomBar)
                  exposureBar = findViewById(R.id.exposureBar)
                  btnRegion = findViewById(R.id.btnRegion)
                  btnPause = findViewById(R.id.btnPause)
                  btnSettings = findViewById(R.id.btnSettings)

                  previewView.scaleType = PreviewView.ScaleType.FIT_CENTER
                  previewView.implementationMode = PreviewView.ImplementationMode.COMPATIBLE

                  val saved = prefs.region
                  if (saved != null) regionNorm = RectF(saved)
                  overlay.region = regionNorm
                  overlay.addOnLayoutChangeListener { v, _, _, _, _, _, _, _, _ ->
                      overlayW = v.width
                      overlayH = v.height
                  }
                  overlay.onRegionChanged = { r ->
                      regionNorm = RectF(r)
                      prefs.region = r
                      tracker.reset()
                      focusOnRegion()
                  }

                  btnRegion.setOnClickListener {
                      overlay.editing = !overlay.editing
                      btnRegion.text = if (overlay.editing) "Tamam" else "Alan seç"
                      if (overlay.editing) setStatus("Altyazının çıktığı bölgeyi parmağınla çiz, sonra 'Tamam'a dokun.")
                  }
                  btnPause.setOnClickListener { togglePause() }
                  btnSettings.setOnClickListener {
                      SettingsDialog.show(this, prefs, translator, speaker) {
                          applySettings()
                          tracker.reset()
                          setStatus("Ayarlar kaydedildi · " + TranslationService.labelFor(prefs.engine))
                      }
                  }

                  previewView.setOnTouchListener { v, e ->
                      if (e.actionMasked == MotionEvent.ACTION_UP) {
                          focusAt(e.x, e.y)
                          v.performClick()
                      }
                      true
                  }

                  analysisExecutor = Executors.newSingleThreadExecutor()
                  applySettings()

                  if (saved == null) {
                      translatedText.text = "Telefonu TV'ye çevir, sonra 'Alan seç' ile altyazının çıktığı bölgeyi çiz."
                  }

                  // İnternet kesilirse yedek olsun diye, Wi-Fi varsa çevrimdışı paketi sessizce indir.
                  lifecycleScope.launch {
                      try {
                          translator.downloadModel(wifiOnly = true)
                      } catch (ignored: Exception) {
                      }
                  }

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                      startCamera()
                  } else {
                      permissionLauncher.launch(Manifest.permission.CAMERA)
                  }
              }

              override fun onStart() {
                  super.onStart()
                  (getSystemService(DISPLAY_SERVICE) as DisplayManager).registerDisplayListener(displayListener, null)
              }

              override fun onStop() {
                  (getSystemService(DISPLAY_SERVICE) as DisplayManager).unregisterDisplayListener(displayListener)
                  super.onStop()
              }

              override fun onWindowFocusChanged(hasFocus: Boolean) {
                  super.onWindowFocusChanged(hasFocus)
                  if (hasFocus) hideSystemBars()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  speaker.shutdown()
                  recognizer.close()
                  translator.close()
                  analysisExecutor.shutdown()
              }

              private fun hideSystemBars() {
                  WindowCompat.setDecorFitsSystemWindows(window, false)
                  WindowInsetsControllerCompat(window, window.decorView).apply {
                      hide(WindowInsetsCompat.Type.systemBars())
                      systemBarsBehavior = WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE
                  }
              }

              @Suppress("DEPRECATION")
              private fun currentRotation(): Int = windowManager.defaultDisplay?.rotation ?: Surface.ROTATION_90

              private fun applySettings() {
                  tracker.requiredStable = prefs.stability
                  enhance = prefs.enhance
                  originalText.visibility = if (prefs.showOriginal) View.VISIBLE else View.GONE
              }

              private fun togglePause() {
                  paused = !paused
                  btnPause.text = if (paused) "Devam" else "Duraklat"
                  if (paused) {
                      speaker.stop()
                      setStatus("Duraklatıldı")
                  } else {
                      tracker.reset()
                      setStatus("Altyazı bekleniyor…")
                  }
              }

              private fun setStatus(msg: String) {
                  statusText.text = msg
              }

              // ---------------- Kamera ----------------

              private fun startCamera() {
                  val future = ProcessCameraProvider.getInstance(this)
                  future.addListener({
                      val provider = try {
                          future.get()
                      } catch (e: Exception) {
                          setStatus("Kamera açılamadı: ${e.message}")
                          return@addListener
                      }
                      val rotation = currentRotation()
                      val aspect = AspectRatioStrategy.RATIO_16_9_FALLBACK_AUTO_STRATEGY

                      val preview = Preview.Builder()
                          .setResolutionSelector(ResolutionSelector.Builder().setAspectRatioStrategy(aspect).build())
                          .setTargetRotation(rotation)
                          .build()
                      preview.setSurfaceProvider(previewView.surfaceProvider)

                      val analysis = ImageAnalysis.Builder()
                          .setResolutionSelector(
                              ResolutionSelector.Builder()
                                  .setAspectRatioStrategy(aspect)
                                  .setResolutionStrategy(
                                      ResolutionStrategy(
                                          Size(1920, 1080),
                                          ResolutionStrategy.FALLBACK_RULE_CLOSEST_LOWER_THEN_HIGHER
                                      )
                                  )
                                  .build()
                          )
                          .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                          .setOutputImageFormat(ImageAnalysis.OUTPUT_IMAGE_FORMAT_RGBA_8888)
                          .setTargetRotation(rotation)
                          .build()
                      analysis.setAnalyzer(analysisExecutor) { proxy -> analyze(proxy) }

                      try {
                          provider.unbindAll()
                          camera = provider.bindToLifecycle(this, CameraSelector.DEFAULT_BACK_CAMERA, preview, analysis)
                          previewUseCase = preview
                          analysisUseCase = analysis
                          setupCameraControls()
                          setStatus("Altyazı bekleniyor… · " + TranslationService.labelFor(prefs.engine))
                          previewView.post { focusOnRegion() }
                      } catch (e: Exception) {
                          setStatus("Kamera başlatılamadı: ${e.message}")
                      }
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun setupCameraControls() {
                  val cam = camera ?: return

                  zoomBar.progress = (prefs.zoom * 100f).toInt()
                  cam.cameraControl.setLinearZoom(prefs.zoom)
                  zoomBar.onProgress { p, fromUser ->
                      if (fromUser) {
                          val z = p / 100f
                          cam.cameraControl.setLinearZoom(z)
                          prefs.zoom = z
                      }
                  }

                  val exposure = cam.cameraInfo.exposureState
                  if (!exposure.isExposureCompensationSupported) {
                      exposureBar.isEnabled = false
                      return
                  }
                  val range = exposure.exposureCompensationRange
                  exposureBar.max = range.upper - range.lower
                  val start = prefs.exposure.coerceIn(range.lower, range.upper)
                  exposureBar.progress = start - range.lower
                  cam.cameraControl.setExposureCompensationIndex(start)
                  exposureBar.onProgress { p, fromUser ->
                      if (fromUser) {
                          val v = p + range.lower
                          cam.cameraControl.setExposureCompensationIndex(v)
                          prefs.exposure = v
                      }
                  }
              }

              private fun focusAt(x: Float, y: Float) {
                  val cam = camera ?: return
                  if (previewView.width == 0) return
                  val point = previewView.meteringPointFactory.createPoint(x, y)
                  val action = FocusMeteringAction.Builder(point, FocusMeteringAction.FLAG_AF or FocusMeteringAction.FLAG_AE)
                      .setAutoCancelDuration(6, TimeUnit.SECONDS)
                      .build()
                  try {
                      cam.cameraControl.startFocusAndMetering(action)
                  } catch (ignored: Exception) {
                  }
              }

              /** Netlemeyi altyazı alanının ortasına yapar. */
              private fun focusOnRegion() {
                  val r = regionNorm
                  focusAt(r.centerX() * previewView.width, r.centerY() * previewView.height)
              }

              // ---------------- Okuma (OCR) ----------------

              private fun analyze(proxy: ImageProxy) {
                  val now = SystemClock.elapsedRealtime()
                  if (paused || busy || now - lastAnalysisAt < ANALYSIS_INTERVAL_MS) {
                      proxy.close()
                      return
                  }
                  lastAnalysisAt = now
                  busy = true

                  val crop: Bitmap?
                  try {
                      val full = proxy.toBitmap()
                      val rotation = proxy.imageInfo.rotationDegrees
                      val upright = if (rotation != 0) {
                          Bitmap.createBitmap(full, 0, 0, full.width, full.height, Matrix().apply { postRotate(rotation.toFloat()) }, true)
                      } else {
                          full
                      }
                      crop = cropToRegion(upright)
                  } catch (e: Exception) {
                      busy = false
                      return
                  } finally {
                      proxy.close()
                  }

                  if (crop == null) {
                      busy = false
                      return
                  }

                  runOnUiThread { cropPreview.setImageBitmap(crop) }

                  recognizer.process(InputImage.fromBitmap(crop, 0))
                      .addOnSuccessListener { result -> onTextRecognized(result) }
                      .addOnCompleteListener { busy = false }
              }

              /**
               * Ekrandaki altyazı alanını kamera görüntüsündeki piksellere çevirip keser.
               * PreviewView FIT_CENTER kullandığı için görüntü ekrana ortalanmış ve oranı korunmuş durumda.
               */
              private fun cropToRegion(bmp: Bitmap): Bitmap? {
                  val vw = overlayW.toFloat()
                  val vh = overlayH.toFloat()
                  if (vw <= 0f || vh <= 0f) return null
                  val scale = min(vw / bmp.width, vh / bmp.height)
                  val offX = (vw - bmp.width * scale) / 2f
                  val offY = (vh - bmp.height * scale) / 2f
                  val r = regionNorm

                  val left = ((r.left * vw - offX) / scale).toInt().coerceIn(0, bmp.width - 1)
                  val top = ((r.top * vh - offY) / scale).toInt().coerceIn(0, bmp.height - 1)
                  val right = ((r.right * vw - offX) / scale).toInt().coerceIn(left + 1, bmp.width)
                  val bottom = ((r.bottom * vh - offY) / scale).toInt().coerceIn(top + 1, bmp.height)
                  if (right - left < 24 || bottom - top < 12) return null

                  var out = Bitmap.createBitmap(bmp, left, top, right - left, bottom - top)

                  // Küçük yazılar için büyüt: ML Kit harf başına ~16 piksel ister.
                  if (out.height < TARGET_CROP_HEIGHT) {
                      val f = min(3f, TARGET_CROP_HEIGHT.toFloat() / out.height)
                      out = Bitmap.createScaledBitmap(out, (out.width * f).toInt(), (out.height * f).toInt(), true)
                  }
                  if (enhance) out = enhanceContrast(out)
                  return out
              }

              private fun enhanceContrast(src: Bitmap): Bitmap {
                  val cm = ColorMatrix().apply { setSaturation(0f) }
                  val c = 1.4f
                  val t = (-0.5f * c + 0.5f) * 255f
                  cm.postConcat(
                      ColorMatrix(
                          floatArrayOf(
                              c, 0f, 0f, 0f, t,
                              0f, c, 0f, 0f, t,
                              0f, 0f, c, 0f, t,
                              0f, 0f, 0f, 1f, 0f
                          )
                      )
                  )
                  val out = Bitmap.createBitmap(src.width, src.height, Bitmap.Config.ARGB_8888)
                  val paint = Paint(Paint.FILTER_BITMAP_FLAG).apply { colorFilter = ColorMatrixColorFilter(cm) }
                  Canvas(out).drawBitmap(src, 0f, 0f, paint)
                  return out
              }

              private fun onTextRecognized(result: Text) {
                  if (paused) return
                  val lines = result.textBlocks
                      .flatMap { it.lines }
                      .sortedWith(compareBy({ it.boundingBox?.top ?: 0 }, { it.boundingBox?.left ?: 0 }))
                      .map { it.text }
                  val text = TextCleaner.clean(lines)

                  val now = SystemClock.elapsedRealtime()
                  if (text.isEmpty()) {
                      if (waitingSince == 0L) waitingSince = now
                      if (now - waitingSince > 1500 && requestCounter == shownCounter) {
                          setStatus("Altyazı bekleniyor… · " + TranslationService.labelFor(prefs.engine))
                      }
                  } else {
                      waitingSince = 0L
                  }

                  val subtitle = tracker.offer(text) ?: return
                  handleSubtitle(subtitle)
              }

              // ---------------- Çeviri + ses ----------------

              private fun handleSubtitle(english: String) {
                  val id = ++requestCounter
                  setStatus("Çevriliyor…")
                  lifecycleScope.launch {
                      try {
                          val result = translator.translate(english)
                          // Daha yeni bir altyazı zaten gösterildiyse eskisini atla.
                          if (id < shownCounter) return@launch
                          if (prefs.readLatestOnly && id != requestCounter) return@launch
                          shownCounter = id
                          translatedText.text = result.text
                          originalText.text = english
                          setStatus("✓ " + result.source)
                          if (prefs.speak && !paused) {
                              speaker.speak(result.text, prefs.speechRate, prefs.readLatestOnly)
                          }
                      } catch (e: Exception) {
                          if (id == requestCounter) shownCounter = id
                          originalText.text = english
                          setStatus("Çeviri yapılamadı: " + (e.message ?: "bağlantı hatası") + " · Ayarlardan 'Cihaz içi'yi deneyebilirsin.")
                      }
                  }
              }

              companion object {
                  private const val ANALYSIS_INTERVAL_MS = 330L
                  private const val TARGET_CROP_HEIGHT = 200
              }
          }

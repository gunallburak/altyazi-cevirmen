          package com.altyazi.cevirmen

          /**
           * Kameradan gelen OCR sonuçlarını izler ve yalnızca YENİ ve KARARLI bir altyazı
           * belirdiğinde metni döndürür. Böylece aynı cümle tekrar tekrar çevrilip okunmaz,
           * harf harf beliren ya da titreyen altyazılar yarım çevrilmez.
           */
          class SubtitleTracker(var requiredStable: Int = 2) {
              private var candidateNorm = ""
              private var candidateRaw = ""
              private var stableCount = 0
              private var lastHandledNorm = ""
              private var emptyCount = 0

              /** Yeni ve kararlı bir altyazı varsa onu döndürür, yoksa null. */
              fun offer(raw: String): String? {
                  val norm = normalize(raw)
                  if (norm.length < MIN_LETTERS) {
                      emptyCount++
                      // Ekranda bir süre altyazı yoksa, aynı cümle tekrar gelirse yeniden okunabilsin.
                      if (emptyCount >= EMPTY_FRAMES_TO_RESET) {
                          lastHandledNorm = ""
                          candidateNorm = ""
                          candidateRaw = ""
                          stableCount = 0
                      }
                      return null
                  }
                  emptyCount = 0

                  if (candidateNorm.isNotEmpty() && (norm == candidateNorm || similarity(norm, candidateNorm) >= SAME_FRAME_SIMILARITY)) {
                      stableCount++
                      // OCR küçük farklar verebilir; en uzun (genelde en eksiksiz) okumayı tut.
                      if (norm.length >= candidateNorm.length) {
                          candidateNorm = norm
                          candidateRaw = raw
                      }
                  } else {
                      candidateNorm = norm
                      candidateRaw = raw
                      stableCount = 1
                  }

                  if (stableCount >= requiredStable) {
                      val alreadyHandled = lastHandledNorm.isNotEmpty() &&
                          similarity(candidateNorm, lastHandledNorm) >= SAME_SUBTITLE_SIMILARITY
                      if (!alreadyHandled) {
                          lastHandledNorm = candidateNorm
                          return candidateRaw
                      }
                  }
                  return null
              }

              fun reset() {
                  candidateNorm = ""
                  candidateRaw = ""
                  stableCount = 0
                  lastHandledNorm = ""
                  emptyCount = 0
              }

              companion object {
                  const val MIN_LETTERS = 3
                  const val EMPTY_FRAMES_TO_RESET = 3
                  const val SAME_FRAME_SIMILARITY = 0.9
                  const val SAME_SUBTITLE_SIMILARITY = 0.85

                  fun normalize(s: String): String =
                      s.lowercase().filter { it.isLetterOrDigit() }

                  /** 0..1 arası benzerlik (Levenshtein mesafesine göre). */
                  fun similarity(a: String, b: String): Double {
                      if (a == b) return 1.0
                      if (a.isEmpty() || b.isEmpty()) return 0.0
                      val maxLen = maxOf(a.length, b.length)
                      // Uzunluk farkı çok büyükse hesaplamaya gerek yok.
                      if (kotlin.math.abs(a.length - b.length).toDouble() / maxLen > 0.5) return 0.0
                      var prev = IntArray(b.length + 1) { it }
                      var cur = IntArray(b.length + 1)
                      for (i in 1..a.length) {
                          cur[0] = i
                          for (j in 1..b.length) {
                              val cost = if (a[i - 1] == b[j - 1]) 0 else 1
                              cur[j] = minOf(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + cost)
                          }
                          val t = prev; prev = cur; cur = t
                      }
                      return 1.0 - prev[b.length].toDouble() / maxLen
                  }
              }
          }

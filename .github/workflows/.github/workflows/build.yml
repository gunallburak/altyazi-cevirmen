# Altyazı Çevirmeni — Android uygulamasını otomatik derleyen dosya.
# Bu dosyayı GitHub deponda .github/workflows/build.yml olarak kaydet.
# Kaydettiğinde GitHub uygulamayı derler ve "Releases" bölümüne APK olarak koyar.
name: APK Oluştur

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Proje dosyalarını oluştur
        run: |
          set -e
          mkdir -p proje
          cd proje
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'__SON__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          val buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInt()

          android {
              namespace = "com.altyazi.cevirmen"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.altyazi.cevirmen"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = buildNumber
                  versionName = "1.0.$buildNumber"
              }

              signingConfigs {
                  create("kendi") {
                      storeFile = file("kendi-anahtar.jks")
                      storePassword = "altyazi2026"
                      keyAlias = "altyazi"
                      keyPassword = "altyazi2026"
                      storeType = "pkcs12"
                  }
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("kendi")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
              lint {
                  abortOnError = false
                  checkReleaseBuilds = false
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0")

              val camerax = "1.4.1"
              implementation("androidx.camera:camera-core:$camerax")
              implementation("androidx.camera:camera-camera2:$camerax")
              implementation("androidx.camera:camera-lifecycle:$camerax")
              implementation("androidx.camera:camera-view:$camerax")

              implementation("com.google.mlkit:text-recognition:16.0.1")
              implementation("com.google.mlkit:translate:17.0.3")
          }

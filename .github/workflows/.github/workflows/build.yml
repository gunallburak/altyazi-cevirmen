          package com.altyazi.cevirmen

          import android.content.Context
          import android.media.AudioAttributes
          import android.speech.tts.TextToSpeech
          import java.util.Locale

          /** Telefonun kendi Türkçe sesiyle çeviriyi okur. */
          class Speaker(context: Context, private val onProblem: (String) -> Unit) : TextToSpeech.OnInitListener {

              var ready = false
                  private set
              var missingTurkish = false
                  private set

              // Alanlardan SONRA oluşturulur ki onInit erken gelirse değerler ezilmesin.
              private val tts = TextToSpeech(context.applicationContext, this)

              override fun onInit(status: Int) {
                  if (status != TextToSpeech.SUCCESS) {
                      onProblem("Sesli okuma başlatılamadı. Telefonda bir metin okuma motoru (ör. Google Konuşma Hizmetleri) olmalı.")
                      return
                  }
                  tts.setAudioAttributes(
                      AudioAttributes.Builder()
                          .setUsage(AudioAttributes.USAGE_MEDIA)
                          .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                          .build()
                  )
                  val r = tts.setLanguage(Locale("tr", "TR"))
                  if (r == TextToSpeech.LANG_MISSING_DATA || r == TextToSpeech.LANG_NOT_SUPPORTED) {
                      missingTurkish = true
                      onProblem("Telefonda Türkçe ses yok. Ayarlar → 'Türkçe ses paketini yükle'.")
                  } else {
                      ready = true
                  }
              }

              fun speak(text: String, rate: Float, interrupt: Boolean) {
                  if (!ready || text.isBlank()) return
                  tts.setSpeechRate(rate)
                  tts.speak(
                      text,
                      if (interrupt) TextToSpeech.QUEUE_FLUSH else TextToSpeech.QUEUE_ADD,
                      null,
                      "altyazi-" + System.nanoTime()
                  )
              }

              fun stop() {
                  tts.stop()
              }

              fun shutdown() {
                  tts.stop()
                  tts.shutdown()
              }
          }

          package com.altyazi.cevirmen

          import android.content.Context
          import android.graphics.RectF

          /** Kullanıcı ayarlarını telefonda saklar. */
          class Prefs(context: Context) {
              private val sp = context.getSharedPreferences("ayarlar", Context.MODE_PRIVATE)

              var engine: String
                  get() = sp.getString("engine", ENGINE_GOOGLE) ?: ENGINE_GOOGLE
                  set(v) = sp.edit().putString("engine", v).apply()

              var deeplKey: String
                  get() = sp.getString("deepl_key", "") ?: ""
                  set(v) = sp.edit().putString("deepl_key", v.trim()).apply()

              var speak: Boolean
                  get() = sp.getBoolean("speak", true)
                  set(v) = sp.edit().putBoolean("speak", v).apply()

              var speechRate: Float
                  get() = sp.getFloat("speech_rate", 1.15f)
                  set(v) = sp.edit().putFloat("speech_rate", v).apply()

              /** true: hep en yeni altyazıyı oku (eskiyi keser). false: sırayla oku. */
              var readLatestOnly: Boolean
                  get() = sp.getBoolean("latest_only", true)
                  set(v) = sp.edit().putBoolean("latest_only", v).apply()

              /** Bir altyazının çevrilmeden önce kaç kez aynı okunması gerektiği (1-3). */
              var stability: Int
                  get() = sp.getInt("stability", 2)
                  set(v) = sp.edit().putInt("stability", v.coerceIn(1, 3)).apply()

              var showOriginal: Boolean
                  get() = sp.getBoolean("show_original", true)
                  set(v) = sp.edit().putBoolean("show_original", v).apply()

              var enhance: Boolean
                  get() = sp.getBoolean("enhance", true)
                  set(v) = sp.edit().putBoolean("enhance", v).apply()

              var zoom: Float
                  get() = sp.getFloat("zoom", 0f)
                  set(v) = sp.edit().putFloat("zoom", v).apply()

              var exposure: Int
                  get() = sp.getInt("exposure", 0)
                  set(v) = sp.edit().putInt("exposure", v).apply()

              /** Altyazı alanı, ekrana göre 0..1 aralığında. Hiç seçilmediyse null. */
              var region: RectF?
                  get() {
                      if (!sp.contains("r_l")) return null
                      return RectF(
                          sp.getFloat("r_l", 0f), sp.getFloat("r_t", 0f),
                          sp.getFloat("r_r", 1f), sp.getFloat("r_b", 1f)
                      )
                  }
                  set(v) {
                      if (v == null) {
                          sp.edit().remove("r_l").remove("r_t").remove("r_r").remove("r_b").apply()
                      } else {
                          sp.edit().putFloat("r_l", v.left).putFloat("r_t", v.top)
                              .putFloat("r_r", v.right).putFloat("r_b", v.bottom).apply()
                      }
                  }

              companion object {
                  const val ENGINE_GOOGLE = "google"
                  const val ENGINE_OFFLINE = "offline"
                  const val ENGINE_DEEPL = "deepl"
              }
          }

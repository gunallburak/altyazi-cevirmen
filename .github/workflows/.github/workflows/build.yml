          package com.altyazi.cevirmen

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.DashPathEffect
          import android.graphics.Paint
          import android.graphics.RectF
          import android.util.AttributeSet
          import android.view.MotionEvent
          import android.view.View
          import kotlin.math.abs
          import kotlin.math.max
          import kotlin.math.min

          /**
           * Kamera görüntüsünün üstünde altyazı alanını gösterir.
           * "Alan seç" modunda parmakla yeni bir dikdörtgen çizilir.
           */
          class RegionOverlayView @JvmOverloads constructor(
              context: Context,
              attrs: AttributeSet? = null
          ) : View(context, attrs) {

              /** Ekrana göre 0..1 aralığında alan. */
              var region: RectF = RectF(DEFAULT_REGION)
                  set(value) {
                      field = RectF(value)
                      invalidate()
                  }

              var editing = false
                  set(value) {
                      field = value
                      invalidate()
                  }

              var onRegionChanged: ((RectF) -> Unit)? = null

              private val density = resources.displayMetrics.density
              private val amber = Color.rgb(0xFF, 0xC9, 0x4A)

              private val dimPaint = Paint().apply { color = Color.argb(115, 0, 0, 0) }
              private val borderPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  style = Paint.Style.STROKE
                  strokeWidth = 2.5f * density
                  color = amber
              }
              private val handlePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = amber }
              private val labelPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.WHITE
                  textSize = 13f * density
                  setShadowLayer(4f, 0f, 1f, Color.BLACK)
              }
              private val dash = DashPathEffect(floatArrayOf(12f * density, 7f * density), 0f)

              private var startX = 0f
              private var startY = 0f

              private fun toPx(r: RectF) = RectF(r.left * width, r.top * height, r.right * width, r.bottom * height)

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  if (width == 0 || height == 0) return
                  val r = toPx(region)
                  val w = width.toFloat()
                  val h = height.toFloat()

                  canvas.drawRect(0f, 0f, w, r.top, dimPaint)
                  canvas.drawRect(0f, r.bottom, w, h, dimPaint)
                  canvas.drawRect(0f, r.top, r.left, r.bottom, dimPaint)
                  canvas.drawRect(r.right, r.top, w, r.bottom, dimPaint)

                  borderPaint.pathEffect = if (editing) dash else null
                  canvas.drawRect(r, borderPaint)

                  if (editing) {
                      val hr = 6f * density
                      canvas.drawCircle(r.left, r.top, hr, handlePaint)
                      canvas.drawCircle(r.right, r.top, hr, handlePaint)
                      canvas.drawCircle(r.left, r.bottom, hr, handlePaint)
                      canvas.drawCircle(r.right, r.bottom, hr, handlePaint)
                  }

                  val label = if (editing) "Altyazının çıktığı bölgeyi parmağınla çiz" else "Altyazı alanı"
                  val y = if (r.top - 8f * density > 18f * density) r.top - 8f * density else r.bottom + 18f * density
                  canvas.drawText(label, r.left + 4f * density, y, labelPaint)
              }

              override fun onTouchEvent(event: MotionEvent): Boolean {
                  if (!editing) return false
                  when (event.actionMasked) {
                      MotionEvent.ACTION_DOWN -> {
                          startX = event.x
                          startY = event.y
                      }
                      MotionEvent.ACTION_MOVE, MotionEvent.ACTION_UP -> {
                          val x = event.x.coerceIn(0f, width.toFloat())
                          val y = event.y.coerceIn(0f, height.toFloat())
                          if (abs(x - startX) > 30f * density && abs(y - startY) > 14f * density) {
                              region = RectF(
                                  min(startX, x) / width, min(startY, y) / height,
                                  max(startX, x) / width, max(startY, y) / height
                              )
                          }
                          if (event.actionMasked == MotionEvent.ACTION_UP) {
                              performClick()
                              onRegionChanged?.invoke(RectF(region))
                          }
                      }
                  }
                  return true
              }

              override fun performClick(): Boolean {
                  super.performClick()
                  return true
              }

              companion object {
                  val DEFAULT_REGION = RectF(0.12f, 0.60f, 0.88f, 0.80f)
              }
          }

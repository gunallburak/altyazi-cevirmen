          package com.altyazi.cevirmen

          import android.content.ActivityNotFoundException
          import android.content.Intent
          import android.graphics.Typeface
          import android.speech.tts.TextToSpeech
          import android.text.InputType
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.RadioButton
          import android.widget.RadioGroup
          import android.widget.ScrollView
          import android.widget.SeekBar
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.appcompat.widget.SwitchCompat
          import androidx.lifecycle.lifecycleScope
          import kotlinx.coroutines.launch
          import java.util.Locale

          /** Ayarlar penceresi (kodla oluşturulur). */
          object SettingsDialog {

              fun show(
                  activity: AppCompatActivity,
                  prefs: Prefs,
                  translator: TranslationService,
                  speaker: Speaker,
                  onSaved: () -> Unit
              ) {
                  val dp = activity.resources.displayMetrics.density
                  fun px(v: Int) = (v * dp).toInt()

                  val root = LinearLayout(activity).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(px(22), px(4), px(22), px(12))
                  }

                  fun header(t: String) = TextView(activity).apply {
                      text = t
                      textSize = 15f
                      setTypeface(typeface, Typeface.BOLD)
                      setPadding(0, px(18), 0, px(4))
                      root.addView(this)
                  }

                  fun note(t: String) = TextView(activity).apply {
                      text = t
                      textSize = 12f
                      alpha = 0.75f
                      setPadding(0, px(2), 0, px(6))
                      root.addView(this)
                  }

                  fun radio(group: RadioGroup, label: String) = RadioButton(activity).apply {
                      id = View.generateViewId()
                      text = label
                      group.addView(this)
                  }

                  fun switch(label: String, checked: Boolean) = SwitchCompat(activity).apply {
                      text = label
                      isChecked = checked
                      setPadding(0, px(6), 0, px(6))
                      root.addView(this)
                  }

                  // --- Çeviri motoru ---
                  header("Çeviri motoru")
                  val engineGroup = RadioGroup(activity)
                  val rbGoogle = radio(engineGroup, "Google · çevrimiçi, hızlı (önerilen)")
                  val rbOffline = radio(engineGroup, "Cihaz içi · internetsiz")
                  val rbDeepl = radio(engineGroup, "DeepL · en doğal çeviri (API anahtarı gerekir)")
                  root.addView(engineGroup)
                  engineGroup.check(
                      when (prefs.engine) {
                          Prefs.ENGINE_OFFLINE -> rbOffline.id
                          Prefs.ENGINE_DEEPL -> rbDeepl.id
                          else -> rbGoogle.id
                      }
                  )

                  val keyField = EditText(activity).apply {
                      hint = "DeepL API anahtarı (yalnızca DeepL için)"
                      setText(prefs.deeplKey)
                      isSingleLine = true
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_VISIBLE_PASSWORD
                      textSize = 14f
                  }
                  root.addView(keyField)
                  note("DeepL anahtarını deepl.com sitesinden 'DeepL API Free' ile ücretsiz alabilirsin (ayda 500.000 karakter).")

                  val dlBtn = Button(activity).apply { text = "Cihaz içi çeviri paketini indir (~30 MB)" }
                  root.addView(dlBtn)
                  note("İnternet kesilirse uygulama bu pakete otomatik geçer. Wi-Fi'deyken bir kez indirmen yeterli.")
                  activity.lifecycleScope.launch {
                      if (translator.isModelDownloaded()) {
                          dlBtn.text = "Cihaz içi paket hazır ✓"
                          dlBtn.isEnabled = false
                      }
                  }
                  dlBtn.setOnClickListener {
                      dlBtn.isEnabled = false
                      dlBtn.text = "İndiriliyor…"
                      activity.lifecycleScope.launch {
                          try {
                              translator.downloadModel(wifiOnly = false)
                              dlBtn.text = "Cihaz içi paket hazır ✓"
                          } catch (e: Exception) {
                              dlBtn.text = "İndirilemedi · tekrar dene"
                              dlBtn.isEnabled = true
                          }
                      }
                  }

                  // --- Sesli okuma ---
                  header("Sesli okuma")
                  val speakSw = switch("Çeviriyi sesli oku", prefs.speak)

                  val rateLabel = TextView(activity).apply { setPadding(0, px(6), 0, 0) }
                  root.addView(rateLabel)
                  val rateBar = SeekBar(activity).apply {
                      max = 150 // 0.50x … 2.00x
                      progress = ((prefs.speechRate * 100f).toInt() - 50).coerceIn(0, 150)
                  }
                  root.addView(rateBar)
                  fun currentRate() = (rateBar.progress + 50) / 100f
                  fun updateRateLabel() {
                      rateLabel.text = String.format(Locale.US, "Konuşma hızı: %.2fx", currentRate())
                  }
                  updateRateLabel()
                  rateBar.onProgress { _, _ -> updateRateLabel() }

                  val modeGroup = RadioGroup(activity)
                  val rbLatest = radio(modeGroup, "Hep en yeni altyazıyı oku (önerilen, geride kalmaz)")
                  val rbQueue = radio(modeGroup, "Tüm altyazıları sırayla oku (hiçbiri atlanmaz)")
                  root.addView(modeGroup)
                  modeGroup.check(if (prefs.readLatestOnly) rbLatest.id else rbQueue.id)

                  val testBtn = Button(activity).apply { text = "Sesi dene" }
                  root.addView(testBtn)
                  testBtn.setOnClickListener {
                      if (speaker.ready) {
                          speaker.speak("Merhaba. Oyundaki altyazılar bu sesle okunacak.", currentRate(), true)
                      } else {
                          Toast.makeText(activity, "Türkçe ses hazır değil.", Toast.LENGTH_SHORT).show()
                      }
                  }
                  if (speaker.missingTurkish || !speaker.ready) {
                      val installBtn = Button(activity).apply { text = "Türkçe ses paketini yükle" }
                      root.addView(installBtn)
                      installBtn.setOnClickListener {
                          try {
                              activity.startActivity(Intent(TextToSpeech.Engine.ACTION_INSTALL_TTS_DATA))
                          } catch (e: ActivityNotFoundException) {
                              Toast.makeText(activity, "Telefon ayarlarında 'Metin okuma' bölümünden Türkçe sesi indir.", Toast.LENGTH_LONG).show()
                          }
                      }
                  }
                  note("Kulaklık ya da Bluetooth hoparlör bağlarsan ses oradan gelir; oyun sesiyle karışmaz.")

                  // --- Okuma ---
                  header("Altyazı okuma")
                  val stabGroup = RadioGroup(activity)
                  val rbFast = radio(stabGroup, "Hızlı tepki")
                  val rbBalanced = radio(stabGroup, "Dengeli (önerilen)")
                  val rbSteady = radio(stabGroup, "Kararlı · görüntü titriyorsa ya da yanlış okuyorsa")
                  root.addView(stabGroup)
                  stabGroup.check(
                      when (prefs.stability) {
                          1 -> rbFast.id
                          3 -> rbSteady.id
                          else -> rbBalanced.id
                      }
                  )
                  val originalSw = switch("İngilizce orijinal metni de göster", prefs.showOriginal)
                  val enhanceSw = switch("Görüntü iyileştirme (siyah-beyaz, yüksek kontrast)", prefs.enhance)
                  note(
                      "İpuçları: Telefonu sabitle, 'Yakınlaştır' ile altyazıyı büyüt, " +
                          "'Parlaklık'ı yazılar parlamayacak kadar düşür. Sol alttaki 'Okunan alan' " +
                          "kutusunda yazıyı net görüyorsan okuma doğru çalışır."
                  )

                  val scroll = ScrollView(activity).apply { addView(root) }

                  AlertDialog.Builder(activity)
                      .setTitle("Ayarlar")
                      .setView(scroll)
                      .setPositiveButton("Kaydet") { _, _ ->
                          prefs.engine = when (engineGroup.checkedRadioButtonId) {
                              rbOffline.id -> Prefs.ENGINE_OFFLINE
                              rbDeepl.id -> Prefs.ENGINE_DEEPL
                              else -> Prefs.ENGINE_GOOGLE
                          }
                          prefs.deeplKey = keyField.text.toString()
                          prefs.speak = speakSw.isChecked
                          prefs.speechRate = currentRate()
                          prefs.readLatestOnly = modeGroup.checkedRadioButtonId != rbQueue.id
                          prefs.stability = when (stabGroup.checkedRadioButtonId) {
                              rbFast.id -> 1
                              rbSteady.id -> 3
                              else -> 2
                          }
                          prefs.showOriginal = originalSw.isChecked
                          prefs.enhance = enhanceSw.isChecked
                          if (prefs.engine == Prefs.ENGINE_DEEPL && prefs.deeplKey.isBlank()) {
                              Toast.makeText(activity, "DeepL için anahtar girmen gerekiyor.", Toast.LENGTH_LONG).show()
                          }
                          onSaved()
                      }
                      .setNegativeButton("Vazgeç", null)
                      .show()
              }
          }

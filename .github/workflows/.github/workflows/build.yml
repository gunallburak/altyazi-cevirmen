          cat > 'app/src/main/java/com/altyazi/cevirmen/TextCleaner.kt' <<'__SON__'
          package com.altyazi.cevirmen

          /** OCR'dan gelen ham metni çeviriye hazır hale getirir. */
          object TextCleaner {
              private val multiSpace = Regex("\\s+")
              private val lonePipe = Regex("(?<=^|\\s)[|](?=\\s|$)")
              private val leadingDash = Regex("^[-–—]\\s*")
              private val junk = Regex("[^\\p{L}\\p{N}\\s.,!?'\"’‘“”:;()\\-–—…%&]")

              /** Satırları (yukarıdan aşağı) birleştirir ve temizler. Uygun değilse boş döner. */
              fun clean(lines: List<String>): String {
                  val joined = lines
                      .map { it.trim() }
                      .filter { it.isNotEmpty() }
                      .joinToString(" ") { line ->
                          // Diyalog satırlarındaki baştaki "- " işaretini kaldır.
                          leadingDash.replace(line, "")
                      }
                  var text = lonePipe.replace(joined, "I")
                  text = junk.replace(text, " ")
                  text = multiSpace.replace(text, " ").trim()

                  val letters = text.count { it.isLetter() }
                  if (letters < 3) return ""
                  // Harf oranı çok düşükse büyük ihtimalle altyazı değil, gürültüdür.
                  val nonSpace = text.count { !it.isWhitespace() }
                  if (nonSpace > 0 && letters.toDouble() / nonSpace < 0.55) return ""
                  return text
              }
          }

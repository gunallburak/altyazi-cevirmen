          mkdir -p cikti
          cp proje/app/build/outputs/apk/release/app-release.apk cikti/AltyaziCevirmeni.apk
          ls -la cikti

      - name: APK'yı Releases bölümüne koy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="surum-${{ github.run_number }}"
          gh release create "$TAG" cikti/AltyaziCevirmeni.apk \
            --repo "${{ github.repository }}" \
            --title "Altyazı Çevirmeni $TAG" \
            --notes "Telefonuna kurmak için aşağıdaki AltyaziCevirmeni.apk dosyasına dokun." \
          || gh release upload "$TAG" cikti/AltyaziCevirmeni.apk --clobber --repo "${{ github.repository }}"

      - name: Yedek olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: AltyaziCevirmeni-apk
          path: cikti/AltyaziCevirmeni.apk
